name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'SelfieSimulator-AndroidStudio.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto
        run: |
          unzip SelfieSimulator-AndroidStudio.zip -d projeto

      - name: Compilar aplicativo
        run: |
          cd projeto/SelfieSimulator
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: SelfieSimulator-APK
          path: projeto/SelfieSimulator/app/build/outputs/apk/debug/app-debug.apk
